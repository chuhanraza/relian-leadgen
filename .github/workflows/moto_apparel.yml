name: moto_apparel daily pipeline

on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 2 * * *"
    - cron: "17 8 * * *"
    - cron: "17 14 * * *"
    - cron: "17 20 * * *"

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
      GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
      GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
      APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
      APOLLO_MAX_CALLS_PER_RUN: ${{ secrets.APOLLO_MAX_CALLS_PER_RUN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Pre-flight credential check
        run: python scripts/healthcheck.py
      - run: python scripts/lead_hunter.py moto_apparel
      - run: python scripts/enricher.py moto_apparel
      - run: python scripts/copywriter.py moto_apparel
      - run: python scripts/sender.py moto_apparel
      - run: python scripts/daily_summary.py moto_apparel
